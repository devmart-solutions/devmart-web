<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Carrito de compras, tarjeta de pago y caja de envío</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <linearGradient id="tarjeta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ec1f3"/>
      <stop offset="1" stop-color="#1e8fd0"/>
    </linearGradient>
    <pattern id="puntos" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#puntos)"/>
  <circle cx="560" cy="540" r="340" fill="#3ec1f3" fill-opacity="0.08"/>
  <circle cx="1220" cy="380" r="240" fill="#1e8fd0" fill-opacity="0.12"/>

  <!-- Carrito -->
  <g transform="translate(240 260)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 40 H110 L180 440 H560" fill="none" stroke="#f5f7fa" stroke-width="30"/>
    <path d="M140 120 H640 L590 360 H185 Z" fill="#3ec1f3" fill-opacity="0.18" stroke="#f5f7fa" stroke-width="30"/>
    <!-- Productos dentro -->
    <rect x="230" y="40" width="130" height="150" rx="16" fill="#3ec1f3"/>
    <rect x="380" y="10" width="110" height="180" rx="16" fill="#1e8fd0"/>
    <circle cx="560" cy="130" r="60" fill="#eaf7fd"/>
    <g fill="#0b0d12" fill-opacity="0.25"><rect x="255" y="80" width="80" height="12" rx="6"/><rect x="405" y="60" width="60" height="12" rx="6"/></g>
    <circle cx="230" cy="540" r="48" fill="#0b0d12" stroke="#f5f7fa" stroke-width="26"/>
    <circle cx="520" cy="540" r="48" fill="#0b0d12" stroke="#f5f7fa" stroke-width="26"/>
  </g>

  <!-- Tarjeta de pago -->
  <g transform="translate(1010 170) rotate(8)">
    <rect x="14" y="20" width="440" height="270" rx="28" fill="#000" fill-opacity="0.35"/>
    <rect width="440" height="270" rx="28" fill="url(#tarjeta)"/>
    <rect x="40" y="70" width="70" height="54" rx="10" fill="#eaf7fd"/>
    <path d="M75 70 v54 M40 97 h70" stroke="#1e8fd0" stroke-width="4"/>
    <g fill="#0b0d12">
      <rect x="40" y="170" width="80" height="18" rx="9"/><rect x="140" y="170" width="80" height="18" rx="9"/>
      <rect x="240" y="170" width="80" height="18" rx="9"/><rect x="340" y="170" width="60" height="18" rx="9"/>
    </g>
    <rect x="40" y="214" width="140" height="14" rx="7" fill="#0b0d12" fill-opacity="0.5"/>
    <circle cx="350" cy="78" r="32" fill="#0b0d12" fill-opacity="0.35"/>
    <circle cx="390" cy="78" r="32" fill="#eaf7fd" fill-opacity="0.6"/>
  </g>

  <!-- Caja de envío -->
  <g transform="translate(1060 560)">
    <path d="M0 90 L190 0 L380 90 L190 180 Z" fill="#eaf7fd"/>
    <path d="M0 90 L190 180 V400 L0 310 Z" fill="#dde2e9"/>
    <path d="M380 90 L190 180 V400 L380 310 Z" fill="#8a93a3"/>
    <path d="M95 45 L285 135 V200 L250 184 V152 L60 62 Z" fill="#3ec1f3"/>
    <rect x="34" y="210" width="110" height="60" rx="8" fill="#ffffff" transform="skewY(25)" />
  </g>
  <!-- Líneas de movimiento -->
  <g stroke="#3ec1f3" stroke-width="12" stroke-linecap="round" stroke-opacity="0.7">
    <line x1="880" y1="760" x2="1010" y2="760"/><line x1="920" y1="820" x2="1020" y2="820"/><line x1="950" y1="880" x2="1030" y2="880"/>
  </g>
</svg>
